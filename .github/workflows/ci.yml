name: BlindPass CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blindpass
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: blindpass
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U blindpass" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://blindpass:test-only-password@localhost:5432/blindpass
      BLINDPASS_ENV: test
      ZCASH_PAYMENT_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
      DOTENV_CONFIG_QUIET: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:stress
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
