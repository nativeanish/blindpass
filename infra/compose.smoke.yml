# Persistent local preview. Keep this project identity and its paired volumes.
# docker compose -p blindpass-smoke -f docker-compose.yml -f infra/compose.smoke.yml up --build -d
name: blindpass-smoke
services:
  postgres:
    ports: !override ["127.0.0.1:55433:5432"]
  api:
    ports: !override ["127.0.0.1:3101:3001"]
    environment:
      ISSUER_ORIGIN: localhost:3100
  web:
    ports: !override ["127.0.0.1:3100:3000"]
